name: Release

on:
  workflow_dispatch:
    inputs:
      dev_release:
        description: Dev release (GitHub only, no Modrinth/CurseForge)
        type: boolean
        default: false
      expected_version:
        description: Safety check, the BASE version you expect in gradle.properties (e.g. 1.0.0, not 1.0.0-beta.2). Required unless dev release
        type: string
        required: false
      version_type:
        description: Release channel (Modrinth/CurseForge)
        type: choice
        options:
          - release
          - beta
          - alpha
        default: release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Read version
        id: meta
        env:
          DEV_RELEASE: ${{ inputs.dev_release }}
          VERSION_TYPE: ${{ inputs.version_type }}
          EXPECTED: ${{ inputs.expected_version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BASE=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "$DEV_RELEASE" != "true" ] || [ -n "$EXPECTED" ]; then
            if [ "$EXPECTED" != "$BASE" ]; then
              echo "mod_version in gradle.properties is '$BASE', but you entered '$EXPECTED'. Nothing was published."
              exit 1
            fi
          fi
          if [ "$DEV_RELEASE" = "true" ]; then
            VERSION="$BASE-dev.$RUN_NUMBER"
          elif [ "$VERSION_TYPE" = "release" ]; then
            VERSION="$BASE"
          else
            COUNT=$(git tag --list "v$BASE-$VERSION_TYPE.*" | wc -l)
            VERSION="$BASE-$VERSION_TYPE.$((COUNT + 1))"
          fi
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Bump mod_version in gradle.properties first."
            exit 1
          fi
          echo "Version: $VERSION"
          if [ "$DEV_RELEASE" = "true" ]; then
            TARGETS="GitHub only (dev release)"
          else
            TARGETS="GitHub, Modrinth and CurseForge as $VERSION_TYPE"
          fi
          {
            echo "## Releasing $VERSION"
            echo
            echo "* Tag: \`$TAG\`"
            echo "* Base version in gradle.properties: \`$BASE\`"
            echo "* Target: $TARGETS"
            echo "* Changelog file: \`changelog/$VERSION.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Load changelog
        env:
          DEV_RELEASE: ${{ inputs.dev_release }}
          VERSION: ${{ steps.meta.outputs.version }}
          VERSION_TYPE: ${{ inputs.version_type }}
        run: |
          BASE=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "$DEV_RELEASE" = "true" ]; then
            echo "Dev build from \`$GITHUB_REF_NAME\` at commit \`${GITHUB_SHA::7}\`. Not for regular play, worlds may break." > notes.md
          elif [ -f "changelog/$VERSION.md" ]; then
            cp "changelog/$VERSION.md" notes.md
          elif [ "$VERSION_TYPE" != "release" ] && [ -f "changelog/$BASE.md" ]; then
            cp "changelog/$BASE.md" notes.md
          else
            echo "Missing changelog/$VERSION.md (betas and alphas may use changelog/$BASE.md). Write it and commit it first. Nothing was published."
            exit 1
          fi
          if [ ! -s notes.md ]; then
            echo "The changelog file is empty. Nothing was published."
            exit 1
          fi
          cat notes.md

      - name: Build
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: ./gradlew build -Pmod_version="$VERSION"

      - name: Publish to Modrinth and CurseForge
        if: ${{ !inputs.dev_release }}
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: hwnXq0GO
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1810354
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: build/libs/createkontor-${{ steps.meta.outputs.version }}.jar

          name: Create Kontor ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          version-type: ${{ inputs.version_type }}
          changelog-file: notes.md

          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          dependencies: |
            create(required){modrinth:create}{curseforge:create}#(ignore:github)
            ldlib2(required){modrinth:B1CBVXHX}{curseforge:626676}#(ignore:github)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          DEV_RELEASE: ${{ inputs.dev_release }}
          VERSION_TYPE: ${{ inputs.version_type }}
        run: |
          FLAGS=()
          if [ "$DEV_RELEASE" = "true" ] || [ "$VERSION_TYPE" != "release" ]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" build/libs/createkontor-$VERSION.jar \
            --target "$GITHUB_SHA" \
            --title "Create: Kontor $TAG" \
            --notes-file notes.md \
            "${FLAGS[@]}"